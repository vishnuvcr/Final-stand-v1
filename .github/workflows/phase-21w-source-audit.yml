name: Phase 21W - External Full-Strike Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - phase-21w-external-full-strike-recovery
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Phase-21W recovery is intentionally rerunnable after any source/parser correction.
    concurrency:
      group: phase21w-external-recovery-v2
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase-21w-external-full-strike-recovery

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phase21w-external-rissin-${{ hashFiles('research/phase21w_external_full_strike_recovery/RECOVERY_TARGETS.md') }}
          restore-keys: |
            phase21w-external-rissin-

      - name: Install research stack
        run: |
          python -m pip install -q --upgrade pip
          pip install -q 'huggingface_hub>=0.36,<0.37' 'polars>=1.20,<2' 'pyarrow>=18,<23' 'numpy>=2,<3' pandas

      - name: Download latest successful Phase 21 combined artifact
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ github.token }}
          workflow: phase-21w-combined-rerun.yml
          branch: phase-21w-combined-frozen-rerun
          workflow_conclusion: success
          name: phase21w-combined-frozen-results
          path: work/combined
          if_no_artifact_found: fail

      - name: Compile source-recovery code
        run: |
          python -m py_compile \
            research/phase21w_external_full_strike_recovery/audit_sources.py \
            research/phase21w_external_full_strike_recovery/recover_rissin_missing.py \
            research/phase21w_external_full_strike_recovery/merge_external_recovery.py

      - name: Audit registered external routes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p research/phase21w_external_full_strike_recovery/output
          python research/phase21w_external_full_strike_recovery/audit_sources.py \
            --output research/phase21w_external_full_strike_recovery/output/source_access_audit.json

      - name: Build exact missing variant-cycle target set
        run: |
          python - <<'PY'
          import csv, json
          from itertools import product
          from pathlib import Path
          base = next(Path('work/combined').rglob('variant_cycle_manifest.csv'))
          calendar = next(Path('work/combined').rglob('baseline_calendar.json'))
          K1_RULES = ['OTM1','OTM2','OTM3','ATM_NEAREST','ATM_UP','ITM1','ITM2','ITM3']
          K2_RULES = ['NEXT1','NEXT2','NEXT3','MIRROR_GAP']
          K3_MULTIPLIERS = [0.5,1.0,1.5,2.0,2.5,3.0,4.0]
          variants = [f'{a}_{b}_K3M{m:g}' for a,b,m in product(K1_RULES,K2_RULES,K3_MULTIPLIERS)]
          expiries = json.load(calendar.open())
          existing=set()
          with base.open() as fh:
              for row in csv.DictReader(fh):
                  existing.add((row['variant_id'], row['target_expiry']))
          expected={(v,e) for v in variants for e in expiries}
          missing_all=expected-existing
          target_expiries={'2026-01-13','2026-02-10','2026-03-10','2026-04-13','2026-05-12'}
          missing=sorted((v,e) for (v,e) in missing_all if e in target_expiries)
          if len(existing) != 11702:
              raise SystemExit(f'Unexpected admitted Phase-21 cell count: {len(existing)}')
          if len(missing) != 1120:
              raise SystemExit(f'Unexpected five-expiry missing-cell count: {len(missing)}')
          out=Path('research/phase21w_external_full_strike_recovery/output')
          out.mkdir(parents=True,exist_ok=True)
          with (out/'recovery_target_cells.csv').open('w',newline='') as fh:
              w=csv.writer(fh)
              w.writerow(['variant_id','target_expiry'])
              w.writerows(missing)
          print(json.dumps({'expected_cells':len(expected),'admitted_cells':len(existing),'missing_cells':len(missing)},indent=2))
          PY

      - name: Recover exact missing variant-cycle cells from current RISSIN archive
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ~/.cache/huggingface
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          HF_HUB_ETAG_TIMEOUT: "30"
          POLARS_IGNORE_TIMEZONE_PARSE_ERROR: "1"
        run: |
          base="$(find work/combined -path '*/output/baseline_calendar.json' -print -quit)"
          spot="$(find work/combined -name selected_weekly_spot_bars.parquet -print -quit)"
          test -n "$base"
          test -n "$spot"
          python research/phase21w_external_full_strike_recovery/recover_rissin_missing.py \
            --hf-cache ~/.cache/huggingface \
            --baseline-calendar "$base" \
            --spot-bars "$spot" \
            --target-cells research/phase21w_external_full_strike_recovery/output/recovery_target_cells.csv \
            --cycle-output research/phase21w_external_full_strike_recovery/output/rissin_recovered_variant_cycles.csv \
            --bars-output research/phase21w_external_full_strike_recovery/output/rissin_recovered_variant_option_bars.parquet \
            --source-summary research/phase21w_external_full_strike_recovery/output/rissin_source_manifest.json

      - name: Merge external bars into frozen 58-cycle input
        run: |
          python research/phase21w_external_full_strike_recovery/merge_external_recovery.py \
            --base-root work/combined \
            --target-cells research/phase21w_external_full_strike_recovery/output/recovery_target_cells.csv \
            --external-cycle research/phase21w_external_full_strike_recovery/output/rissin_recovered_variant_cycles.csv \
            --external-bars research/phase21w_external_full_strike_recovery/output/rissin_recovered_variant_option_bars.parquet \
            --output-dir work/final_input

      - name: Restore exact Phase 9 frozen interface for the engine
        run: |
          rm -rf research/phase9_weekly/output
          mkdir -p research/phase9_weekly/output
          cp work/final_input/phase9_weekly/output/weekly_cycle_manifest.csv research/phase9_weekly/output/weekly_cycle_manifest.csv
          cp work/final_input/phase9_weekly/output/selected_weekly_spot_bars.parquet research/phase9_weekly/output/selected_weekly_spot_bars.parquet

      - name: Restore the exact frozen engine revision
        run: |
          git fetch origin phase-21w-combined-frozen-rerun --depth=1
          git checkout origin/phase-21w-combined-frozen-rerun -- \
            research/phase17w_strike_alternatives/strike_alternatives.py \
            research/phase11_weekly/weekly_backtest.py \
            research/phase9_weekly/hf_weekly_ingest.py

      - name: Run final 224-variant 63-cycle frozen rerun
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          spot="$(find work/final_input -path '*/phase9_weekly/output/selected_weekly_spot_bars.parquet' -print -quit)"
          baseline="$(find work/final_input -path '*/phase9_weekly/output/weekly_cycle_manifest.csv' -print -quit)"
          test -n "$spot"
          test -n "$baseline"
          rm -rf research/phase21w_external_full_strike_recovery/output/final_rerun
          python research/phase17w_strike_alternatives/strike_alternatives.py \
            --variant-start 0 \
            --variant-end 224 \
            --baseline-manifest "$baseline" \
            --expiry-start 0 \
            --expiry-end 63 \
            --built-input-dir work/final_input \
            --hf-cache ~/.cache/huggingface \
            --output-dir research/phase21w_external_full_strike_recovery/output/final_rerun

      - name: Validate final coverage before publishing
        run: |
          python - <<'PY'
          import json
          from statistics import mean
          v=json.load(open("research/phase21w_external_full_strike_recovery/output/final_rerun/variant_summary.json"))
          c=json.load(open("work/final_input/coverage.json"))
          assert c["missing_expiries"] == [], c
          assert c["combined_bar_variant_cycle_cells"] == c["combined_cycle_cells"], c
          assert len(v) == 224
          rates=[float(x["valid_rate_all_63"]) for x in v]
          validity_floor=50.0/63.0
          summary={
              "variant_count": len(v),
              "min_valid_rate_all_63": min(rates),
              "max_valid_rate_all_63": max(rates),
              "mean_valid_rate_all_63": mean(rates),
              "variants_meeting_50_of_63_validity_floor": sum(r >= validity_floor for r in rates),
              "variants_below_50_of_63_validity_floor": sum(r < validity_floor for r in rates),
              "validity_floor": validity_floor,
              "validity_floor_passed_for_all_variants": min(rates) >= validity_floor,
              "coverage_gate_passed": True,
          }
          with open("research/phase21w_external_full_strike_recovery/output/final_validation_summary.json","w") as fh:
              json.dump(summary, fh, indent=2)
          print(json.dumps(summary, indent=2))
          print("FINAL_63_CYCLE_COVERAGE_OK")
          PY

      - name: Upload complete recovery and rerun artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase21w-external-full-strike-recovery-results
          path: |
            research/phase21w_external_full_strike_recovery/output/
            work/final_input/recovery_target_cells.csv
            work/final_input/coverage.json
            work/final_input/variant_cycle_manifest.csv
          if-no-files-found: error
          retention-days: 30

      - name: Commit compact recovery metadata and results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/phase21w_external_full_strike_recovery/output
          git diff --cached --quiet || git commit -m 'phase21w: record final external recovery and 63-cycle rerun'
          # The frozen engine/interface files are intentionally restored only for execution.
          # Clean those temporary tracked changes before rebasing the compact result commit.
          git reset --hard HEAD
          git fetch origin phase-21w-external-full-strike-recovery
          git rebase origin/phase-21w-external-full-strike-recovery
          git push origin HEAD:phase-21w-external-full-strike-recovery
