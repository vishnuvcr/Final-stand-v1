name: Phase 21W - Public HF Missing-Expiry Probe

on:
  workflow_dispatch:
  push:
    branches: [phase-21w-external-full-strike-recovery]
    paths:
      - 'research/phase21w_external_full_strike_recovery/probe_hf_missing.py'
      - '.github/workflows/phase-21w-public-hf-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-21w-external-full-strike-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phase21w-public-hf-${{hashFiles('research/phase21w_external_full_strike_recovery/PHASE_PLAN.md')}}
      - run: pip install -q 'huggingface_hub>=0.36,<0.37' 'polars>=1.20,<2' pyarrow
      - name: Probe five missing expiries
        env:
          HF_TOKEN: ${{secrets.HF_TOKEN}}
        run: python research/phase21w_external_full_strike_recovery/probe_hf_missing.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase21w-public-hf-missing-expiry-probe
          path: research/phase21w_external_full_strike_recovery/output/hf_missing_expiry_probe.*
          if-no-files-found: error
      - name: Commit compact probe outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/phase21w_external_full_strike_recovery/output/hf_missing_expiry_probe.json research/phase21w_external_full_strike_recovery/output/hf_missing_expiry_probe.csv
          git diff --cached --quiet || git commit -m 'phase21w: record public HF missing-expiry probe'
          git push origin HEAD:phase-21w-external-full-strike-recovery
