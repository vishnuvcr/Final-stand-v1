name: Phase 9W - Hugging Face Weekly Data Gate

on:
  push:
    branches:
      - phase-9w-hf-data-gate
  workflow_dispatch:
    inputs:
      max_expiries:
        description: "Number of most recent NIFTY expiry files"
        required: true
        default: "104"
      start_date:
        description: "Earliest expiry date"
        required: true
        default: "2024-01-01"
      end_date:
        description: "Latest expiry date"
        required: true
        default: "2026-12-31"

permissions:
  contents: write

concurrency:
  group: phase-9w-hf-data-gate
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'research: record phase 9W HF data gate output')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout weekly data-gate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data stack
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.36,<0.37" "polars>=1.20,<2" "pyarrow>=18,<23"

      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-phase9w-v2-${{ inputs.start_date }}-${{ inputs.end_date }}-${{ inputs.max_expiries }}
          restore-keys: |
            hf-phase9w-${{ inputs.start_date }}-${{ inputs.end_date }}-${{ inputs.max_expiries }}-
            hf-phase9w-

      - name: Compile and unit-test ingestion helpers
        run: |
          python -m py_compile research/phase9_weekly/hf_weekly_ingest.py research/phase9_weekly/validate_pilot.py research/phase9_weekly/test_hf_weekly_ingest.py research/phase9_weekly/hf_crosscheck.py
          cd research/phase9_weekly
          python test_hf_weekly_ingest.py

      - name: Verify HF_TOKEN is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          echo "HF_TOKEN is configured."

      - name: Ingest weekly NIFTY data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REVISION: main
          HF_HOME: ~/.cache/huggingface
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          HF_HUB_ETAG_TIMEOUT: "30"
        run: |
          python research/phase9_weekly/hf_weekly_ingest.py \
            --max-expiries "${{ inputs.max_expiries }}" \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --output-dir research/phase9_weekly/output \
            --hf-cache ~/.cache/huggingface

      - name: Cross-check 2025 against secondary Hugging Face source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ~/.cache/huggingface
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          HF_HUB_ETAG_TIMEOUT: "30"
        run: |
          python research/phase9_weekly/hf_crosscheck.py \
            --year 2025 \
            --cycle-manifest research/phase9_weekly/output/weekly_cycle_manifest.csv \
            --output research/phase9_weekly/output/source_crosscheck.csv \
            --hf-cache ~/.cache/huggingface

      - name: Validate pilot
        run: |
          python research/phase9_weekly/validate_pilot.py

      - name: Upload pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-9w-hf-ingest-${{ github.run_number }}
          path: |
            research/phase9_weekly/output/source_manifest.json
            research/phase9_weekly/output/weekly_cycle_manifest.csv
            research/phase9_weekly/output/selected_weekly_option_bars.parquet
            research/phase9_weekly/output/selected_weekly_spot_bars.parquet
            research/phase9_weekly/output/source_crosscheck.csv
          if-no-files-found: error
          retention-days: 30

      - name: Commit non-raw research metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/phase9_weekly/output/source_manifest.json research/phase9_weekly/output/weekly_cycle_manifest.csv research/phase9_weekly/output/source_crosscheck.csv
          git diff --cached --quiet || git commit -m "research: record phase 9W HF data gate output"
          git push
