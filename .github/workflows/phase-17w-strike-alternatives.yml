name: Phase 17W - K1/K2 Strike Alternatives

on:
  push:
    branches:
      - phase-17w-strike-alternatives
    paths-ignore:
      - 'research/logs/RESEARCH_LOG.md'
      - 'research/logs/ERROR_LOG.md'
      - 'research/phase17w_strike_alternatives/STATUS.md'
      - 'research/phase17w_strike_alternatives/output/**'
  workflow_dispatch:
    inputs:
      max_expiries:
        description: "Weekly expiry files"
        required: true
        default: "104"

concurrency:
  group: phase-17w-strike-alternatives
  cancel-in-progress: true

permissions:
  contents: write

env:
  MAX_EXPIRIES: ${{ inputs.max_expiries || '104' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.36,<0.37" "polars>=1.20,<2" "pyarrow>=18,<23" "numpy>=2,<3" pytest
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-phase17w-v2-${{ env.MAX_EXPIRIES }}
      - name: Verify token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: test -n "$HF_TOKEN"
      - name: Build frozen Phase 9 data interface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REVISION: main
          HF_HOME: ~/.cache/huggingface
        run: |
          rm -rf research/phase9_weekly/output
          python research/phase9_weekly/hf_weekly_ingest.py --max-expiries "$MAX_EXPIRIES" --start-date "2024-01-01" --end-date "2026-12-31" --output-dir research/phase9_weekly/output --hf-cache ~/.cache/huggingface
      - name: Verify frozen interface
        run: |
          python - <<'PY'
          import polars as pl
          m = pl.read_csv("research/phase9_weekly/output/weekly_cycle_manifest.csv")
          u = m.filter(pl.col("status")=="USABLE_OHLC")
          assert u.height == 63, f"Expected 63 usable cycles, got {u.height}"
          print("Phase 9 usable cycles:", u.height)
          PY
      - name: Cache prepared Phase 9 interface
        uses: actions/cache@v4
        with:
          path: research/phase9_weekly/output
          key: phase17w-prepared-v2-${{ env.MAX_EXPIRIES }}

  variants:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {chunk: 0, start: 0, end: 28}
          - {chunk: 1, start: 28, end: 56}
          - {chunk: 2, start: 56, end: 84}
          - {chunk: 3, start: 84, end: 112}
          - {chunk: 4, start: 112, end: 140}
          - {chunk: 5, start: 140, end: 168}
          - {chunk: 6, start: 168, end: 196}
          - {chunk: 7, start: 196, end: 224}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.36,<0.37" "polars>=1.20,<2" "pyarrow>=18,<23" "numpy>=2,<3" pytest
      - name: Restore Hugging Face cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-phase17w-v2-${{ env.MAX_EXPIRIES }}
      - name: Restore prepared Phase 9 interface
        uses: actions/cache/restore@v4
        with:
          path: research/phase9_weekly/output
          key: phase17w-prepared-v2-${{ env.MAX_EXPIRIES }}
      - name: Compile tests
        run: |
          python -m py_compile research/phase17w_strike_alternatives/strike_alternatives.py
          python -m pytest -q research/phase17w_strike_alternatives/test_strike_alternatives.py
      - name: Verify 63-cycle interface
        run: |
          python - <<'PY'
          import polars as pl
          m=pl.read_csv("research/phase9_weekly/output/weekly_cycle_manifest.csv")
          assert m.filter(pl.col("status")=="USABLE_OHLC").height == 63
          PY
      - name: Run deterministic variant chunk
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REVISION: main
          HF_HOME: ~/.cache/huggingface
        run: |
          python -m research.phase17w_strike_alternatives.strike_alternatives             --max-expiries "$MAX_EXPIRIES"             --start-date "2024-01-01"             --end-date "2026-12-31"             --hf-cache ~/.cache/huggingface             --output-dir "research/phase17w_strike_alternatives/output/chunk_${{ matrix.chunk }}"             --variant-start "${{ matrix.start }}"             --variant-end "${{ matrix.end }}"
      - name: Audit chunk
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/phase17w_strike_alternatives/output/chunk_${{ matrix.chunk }}/variant_summary.json")
          rows=json.loads(p.read_text())
          assert len(rows)==28
          assert len({r["variant_id"] for r in rows})==28
          print("chunk", "${{ matrix.chunk }}", "variants", len(rows))
          PY
      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: phase17w-chunk-${{ matrix.chunk }}
          path: research/phase17w_strike_alternatives/output/chunk_${{ matrix.chunk }}
          retention-days: 60

  aggregate:
    needs: variants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stack
        run: |
          pip install "polars>=1.20,<2" "pyarrow>=18,<23" "numpy>=2,<3"
      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          pattern: phase17w-chunk-*
          path: chunks
          merge-multiple: false
      - name: Aggregate and apply global Holm gate
        run: |
          python - <<'PY'
          import csv, json, pathlib, shutil
          import polars as pl
          from research.phase17w_strike_alternatives.strike_alternatives import VARIANT_IDS, holm_adjust

          root=pathlib.Path("chunks")
          files=sorted(root.glob("**/variant_summary.json"))
          assert len(files)==8, f"Expected 8 chunk summaries, got {len(files)}"
          rows=[]
          for f in files:
              rows.extend(json.loads(f.read_text()))
          assert len(rows)==224, f"Expected 224 variant rows, got {len(rows)}"
          ids=[r["variant_id"] for r in rows]
          assert len(set(ids))==224
          assert set(ids)==set(VARIANT_IDS)

          pvals=[(r["variant_id"], r.get("training_bootstrap_p_value")) for r in rows]
          adjusted=holm_adjust(pvals)
          for r in rows:
              r["training_holm_adjusted_p"]=adjusted.get(r["variant_id"])
              tr=r["training"]; va=r["validation"]
              r["promotable_to_capital_phase"]=bool(
                  r.get("valid_rate_all_63") is not None
                  and r["valid_rate_all_63"] >= (50.0/63.0)
                  and tr.get("n",0) >= 30
                  and tr.get("mean_net_rupees",-1e99) > 0
                  and va.get("n",0) >= 8
                  and va.get("mean_net_rupees",-1e99) > 0
                  and r["training_holm_adjusted_p"] is not None
                  and r["training_holm_adjusted_p"] < 0.05
              )

          out=pathlib.Path("research/phase17w_strike_alternatives/output")
          out.mkdir(parents=True,exist_ok=True)
          (out/"variant_summary.json").write_text(json.dumps(rows,indent=2))
          (out/"variant_registry.json").write_text(json.dumps({
              "k1_rules":["OTM1","OTM2","OTM3","ATM_NEAREST","ATM_UP","ITM1","ITM2","ITM3"],
              "k2_rules":["NEXT1","NEXT2","NEXT3","MIRROR_GAP"],
              "k3_multipliers":[0.5,1.0,1.5,2.0,2.5,3.0,4.0],
              "variant_ids":VARIANT_IDS
          },indent=2))
          cal_files=sorted(root.glob("**/baseline_calendar.json"))
          assert len(cal_files)==8
          calendars=[json.loads(f.read_text()) for f in cal_files]
          assert all(c==calendars[0] for c in calendars)
          assert len(calendars[0])==63
          (out/"baseline_calendar.json").write_text(json.dumps(calendars[0],indent=2))

          trade_files=sorted(root.glob("**/all_variant_trades.csv"))
          frames=[pl.read_csv(f) for f in trade_files]
          trades=pl.concat(frames,how="vertical_relaxed")
          assert trades["variant_id"].n_unique()==224
          trades.write_csv(out/"all_variant_trades.csv")
          print("GLOBAL VARIANTS:",len(rows))
          print("GLOBAL TRADES:",trades.height)
          print("PROMOTABLE:",[r["variant_id"] for r in rows if r["promotable_to_capital_phase"]])
          PY
      - name: Upload final results
        uses: actions/upload-artifact@v4
        with:
          name: phase17w-final-results-${{ github.run_number }}
          path: |
            research/phase17w_strike_alternatives/output/variant_summary.json
            research/phase17w_strike_alternatives/output/variant_registry.json
            research/phase17w_strike_alternatives/output/baseline_calendar.json
            research/phase17w_strike_alternatives/output/all_variant_trades.csv
          retention-days: 60
      - name: Commit machine-readable results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/phase17w_strike_alternatives/output
          git diff --cached --quiet || git commit -m "research: record phase 17W K1/K2 alternative results"
          git push
