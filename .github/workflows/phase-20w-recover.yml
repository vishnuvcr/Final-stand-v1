name: Phase 20W - Recover Missing Executable Bars

on:
  workflow_dispatch:
  push:
    branches: [phase-20w-executable-bar-recovery]
    paths:
      - 'research/phase20w_executable_bar_recovery/recover_missing.py'
      - 'research/phase20w_executable_bar_recovery/output/required_missing_variant_bars.csv'
      - '.github/workflows/phase-20w-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    concurrency:
      group: phase20w-recovery
      cancel-in-progress: true
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-20w-executable-bar-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tooling
        run: pip install -q huggingface_hub polars pandas pyarrow
      - name: Restore frozen Phase 9 baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/phase9_weekly/output
          curl -L --fail -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" https://api.github.com/repos/vishnuvcr/Final-stand-v1/actions/artifacts/11060261904/zip -o /tmp/p9.zip
          unzip -o /tmp/p9.zip -d research/phase9_weekly/output
          test -f research/phase9_weekly/output/weekly_cycle_manifest.csv
      - name: Recover missing bars
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_CACHE: ~/.cache/huggingface
          POLARS_IGNORE_TIMEZONE_PARSE_ERROR: '1'
        run: python research/phase20w_executable_bar_recovery/recover_missing.py
      - name: Commit recovery manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find research/phase20w_executable_bar_recovery/output -type f -not -name 'recovered_executable_bars.parquet' -print0 | xargs -0 git add
          git diff --cached --quiet || git commit -m 'phase20w: record executable-bar recovery'
          git pull --rebase --autostash origin phase-20w-executable-bar-recovery
          git push origin HEAD:phase-20w-executable-bar-recovery
      - name: Upload recovered bars
        uses: actions/upload-artifact@v4
        with:
          name: phase20w-recovered-executable-bars
          path: research/phase20w_executable_bar_recovery/output/
          if-no-files-found: error
