name: Phase 12W - Weekly Robustness
# Robustness rerun marker

on:
  push:
    branches:
      - phase-12w-robustness
  workflow_dispatch:
    inputs:
      max_expiries:
        description: "Weekly expiries"
        required: true
        default: "104"

permissions:
  contents: write

jobs:
  robustness:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'research: record phase 12W robustness output')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.36,<0.37" "polars>=1.20,<2" "pyarrow>=18,<23" "numpy>=2,<3"

      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-phase12w-v1-${{ inputs.max_expiries || '104' }}
          restore-keys: |
            hf-phase12w-v1-
            hf-phase11w-v1-
            hf-phase9w-v2-

      - name: Compile
        run: python -m py_compile research/phase9_weekly/hf_weekly_ingest.py research/phase11_weekly/weekly_backtest.py research/phase12_weekly/robustness.py

      - name: Verify HF token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: test -n "$HF_TOKEN"

      - name: Build cached weekly data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REVISION: main
          HF_HOME: ~/.cache/huggingface
        run: |
          python research/phase9_weekly/hf_weekly_ingest.py             --max-expiries "${{ inputs.max_expiries || '104' }}"             --start-date "2024-01-01"             --end-date "2026-12-31"             --output-dir research/phase9_weekly/output             --hf-cache ~/.cache/huggingface

      - name: Generate stop and slippage stress grid
        run: |
          rm -rf research/phase12_weekly/input
          mkdir -p research/phase12_weekly/input
          for slip in 0.00 0.25 0.50 1.00 2.00; do
            for stop in none 50 100 150 200 300; do
              out="research/phase12_weekly/input/trades_slip_${slip}_stop_${stop}.csv"
              if [ "$stop" = "none" ]; then
                python research/phase11_weekly/weekly_backtest.py                   --manifest research/phase9_weekly/output/weekly_cycle_manifest.csv                   --options research/phase9_weekly/output/selected_weekly_option_bars.parquet                   --spot research/phase9_weekly/output/selected_weekly_spot_bars.parquet                   --slippage-points "$slip"                   --output "$out"
              else
                python research/phase11_weekly/weekly_backtest.py                   --manifest research/phase9_weekly/output/weekly_cycle_manifest.csv                   --options research/phase9_weekly/output/selected_weekly_option_bars.parquet                   --spot research/phase9_weekly/output/selected_weekly_spot_bars.parquet                   --slippage-points "$slip"                   --stop-loss-points "$stop"                   --output "$out"
              fi
            done
          done

      - name: Analyse robustness
        run: |
          python research/phase12_weekly/robustness.py             --input-dir research/phase12_weekly/input             --output research/phase12_weekly/robustness.json

      - name: Upload robustness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-12w-robustness-${{ github.run_number }}
          path: |
            research/phase12_weekly/robustness.json
            research/phase12_weekly/input/
          retention-days: 30

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/phase12_weekly/robustness.json
          git diff --cached --quiet || git commit -m "research: record phase 12W robustness output"
          git push
