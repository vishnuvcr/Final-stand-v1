name: Phase 13W - Untouched Weekly Holdout
# Trigger marker: phase13w-active
# Manual/automatic holdout execution gate
# Data interface fix trigger

on:
  push:
    branches:
      - phase-13w-untouched-holdout
    paths-ignore:
      - 'research/phase13_weekly/holdout.json'
  workflow_dispatch:
    inputs:
      max_expiries:
        description: "Weekly expiries"
        required: true
        default: "104"

permissions:
  contents: write

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.36,<0.37" "polars>=1.20,<2" "pyarrow>=18,<23" "numpy>=2,<3"
      - name: Cache Hugging Face data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-phase13w-v1-${{ inputs.max_expiries || '104' }}
          restore-keys: |
            hf-phase13w-v1-
            hf-phase12w-v1-
            hf-phase11w-v1-
            hf-phase9w-v2-
      - name: Compile and test
        run: |
          python -m py_compile research/phase9_weekly/hf_weekly_ingest.py research/phase11_weekly/weekly_backtest.py research/phase13_weekly/holdout.py
          cd research/phase13_weekly
          python test_holdout.py
      - name: Verify HF token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: test -n "$HF_TOKEN"
      - name: Build weekly data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REVISION: main
          HF_HOME: ~/.cache/huggingface
        run: |
          python research/phase9_weekly/hf_weekly_ingest.py --max-expiries "${{ inputs.max_expiries || '104' }}" --start-date "2024-01-01" --end-date "2026-12-31" --output-dir research/phase9_weekly/output --hf-cache ~/.cache/huggingface
      - name: Diagnose Phase 9 to Phase 11 data interface
        run: |
          python - <<'PY'
          import polars as pl
          m = pl.read_csv("research/phase9_weekly/output/weekly_cycle_manifest.csv")
          o = pl.read_parquet("research/phase9_weekly/output/selected_weekly_option_bars.parquet")
          s = pl.read_parquet("research/phase9_weekly/output/selected_weekly_spot_bars.parquet")
          print("manifest rows", m.height, "columns", m.columns)
          print("status counts", m.group_by("status").len().sort("len", descending=True).to_dicts())
          print("options rows", o.height, "columns", o.columns)
          print("spot rows", s.height, "columns", s.columns)
          print("sample option timestamps", o.select("timestamp").unique().head(10).to_series().cast(pl.String).to_list())
          print("sample manifest timestamps", m.select("entry_timestamp").head(5).to_series().cast(pl.String).to_list())
          print("option timestamp dtype", o.schema["timestamp"], "manifest dtype", m.schema["entry_timestamp"])
          usable = m.filter(pl.col("status")=="USABLE_OHLC")
          for row in usable.head(5).iter_rows(named=True):
              ets=str(row["entry_timestamp"]); lts=str(row["lock_timestamp"]); strikes=[float(row["k1"]),float(row["k2"]),float(row["k3"])]
              key_e=ets[:19]
              key_l=lts[:19]
              ts_key=o.select(pl.col("timestamp").cast(pl.String).str.replace(r" ", "T").str.slice(0,19)).to_series()
              er_all=o.filter(ts_key==key_e)
              lr_all=o.filter(ts_key==key_l)
              er=er_all.filter(pl.col("strike").is_in(strikes)).height
              lr=lr_all.filter(pl.col("strike").is_in(strikes)).height
              se=s.filter(pl.col("timestamp").cast(pl.String).str.starts_with(str(row["target_expiry"]))).height
              print("cycle",row["target_expiry"],"entry_all_rows",er_all.height,"entry_rows",er,"entry_strikes",er_all.select("strike").unique().to_series().to_list(),"lock_all_rows",lr_all.height,"lock_rows",lr,"lock_strikes",lr_all.select("strike").unique().to_series().to_list(),"expiry_spot_rows",se,"entry_ts",ets,"lock_ts",lts,"strikes",strikes)
          PY
      - name: Generate frozen-rule candidates
        run: |
          rm -rf research/phase13_weekly/input
          mkdir -p research/phase13_weekly/input
          for stop in 25 50 75 100 150 200 300; do
            python research/phase11_weekly/weekly_backtest.py --manifest "research/phase9_weekly/output/weekly_cycle_manifest.csv" --options "research/phase9_weekly/output/selected_weekly_option_bars.parquet" --spot "research/phase9_weekly/output/selected_weekly_spot_bars.parquet" --slippage-points "0.50" --stop-loss-points "$stop" --output "research/phase13_weekly/input/trades_slip_0.50_stop_${stop}.csv"
          done
      - name: Apply frozen training-only selection
        run: python research/phase13_weekly/holdout.py
      - name: Upload holdout artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-13w-untouched-holdout-${{ github.run_number }}
          path: |
            research/phase13_weekly/holdout.json
            research/phase13_weekly/input/
          retention-days: 30
      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/phase13_weekly/holdout.json
          git diff --cached --quiet || git commit -m "research: record phase 13W holdout output"
          git push
