name: Phase 19W - Recovered Data Empirical Rerun

on:
  workflow_dispatch:
  push:
    branches: [phase-19w-recovered-rerun]

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phase19w-hf03-0f480e43-${{hashFiles('research/phase17w_strike_alternatives/VARIANT_REGISTRY.md')}}
      - run: pip install -q huggingface_hub polars numpy pandas pyarrow
      - name: Run fixed 224-variant rerun
        env:
          HF_TOKEN: ${{secrets.HF_TOKEN}}
          HF_REVISION: 0f4800e43e6f96cec0794369d78eb4d3c4211ef5
        run: |
          python research/phase17w_strike_alternatives/strike_alternatives.py \
            --variant-start 0 \
            --variant-end 224 \
            --hf-cache ~/.cache/huggingface \
            --baseline-manifest research/phase9_weekly/output/weekly_cycle_manifest.csv \
            --expiry-start 0 \
            --expiry-end 63 \
            --output-dir research/phase19w_recovered_rerun/output
      - uses: actions/upload-artifact@v4
        with:
          name: phase19w-recovered-results
          path: research/phase19w_recovered_rerun/output/
          if-no-files-found: error
      - name: Commit empirical results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/phase19w_recovered_rerun/output
          git diff --cached --quiet || git commit -m 'phase19w: record recovered-data empirical rerun'
          git push
